
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSCI 300 - Operating Systems</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      color: #172b4d;
    }
    header {
      background: #183b70;
      color: white;
      padding: 45px 20px;
      text-align: center;
    }
    main {
      max-width: 1050px;
      margin: 35px auto;
      padding: 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000012;
    }
    .card h2 { margin-top: 0; }
    .button {
      display: inline-block;
      padding: 10px 16px;
      background: #1769aa;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
    .soon { color: #777; }
    footer {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CSCI 300 - Operating Systems</h1>
    <p>Interactive Learning Labs</p>
    <p>Dr. Maher Alrahhal</p>
  </header>
  <main>
    <h2>Weekly Learning Activities</h2>
    <div class="grid" id="weeks"></div>
  </main>
  <footer>CSCI 300 | Operating Systems</footer>

  <script>
    const publishedWeeks = [];
    const container = document.getElementById("weeks");

    for (let week = 1; week <= 15; week++) {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = "Week " + week;
      card.appendChild(title);

      if (publishedWeeks.includes(week)) {
        const link = document.createElement("a");
        link.className = "button";
        link.href = "./Week-" + week + "/index.html";
        link.textContent = "Open Learning Lab";
        card.appendChild(link);
      } else {
        const message = document.createElement("p");
        message.className = "soon";
        message.textContent = "Coming Soon";
        card.appendChild(message);
      }
      container.appendChild(card);
    }
  </script>
</body>
</html>
